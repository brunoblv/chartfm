<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/styles.css">
  <script src="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/_ds_bundle.js"></script>
  <style>
    body{margin:0;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    a:hover{color:var(--accent-hover)}
    ::-webkit-scrollbar{height:0;width:0}
  </style>
</helmet>

<div data-theme="dark" style="background:var(--bg);min-height:100vh;font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;color:var(--text)">

  <div style="position:sticky;top:0;z-index:20;background:var(--bg-topbar);borderBottom:1px solid var(--divider);backdrop-filter:blur(12px)">
    <div style="max-width:1000px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;gap:32px">
      <x-import component-from-global-scope="ChartFM.ChartFMLogo" size="{{ 26 }}" hint-size="120px,26px"></x-import>
      <div style="flex:1"></div>
      <a href="#" style="font-size:14px;font-weight:600;color:var(--text-muted)">← Perfil</a>
    </div>
  </div>

  <div style="max-width:1000px;margin:0 auto;padding:44px 40px 96px">
    <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)">Perfil</div>
    <div style="font-size:34px;font-weight:800;letter-spacing:-0.03em;margin-top:8px">Biblioteca</div>
    <div style="font-size:15px;color:var(--text-muted);margin-top:8px">Tudo que você salvou em um só lugar.</div>

    <div style="display:flex;gap:8px;margin-top:24px;overflow-x:auto">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
        <div style="{{ t.style }}">{{ t.label }}</div>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px">
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="6">
        <a href="#" style="display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--divider);border-radius:16px;padding:14px;color:var(--text)">
          <x-import component-from-global-scope="ChartFM.Cover" cover="{{ i.cover }}" size="{{ 56 }}" rounded="{{ i.radius }}" hint-size="56px,56px"></x-import>
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)">{{ i.type }}</div>
            <div style="font-size:14.5px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ i.title }}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:1px">{{ i.subtitle }}</div>
          </div>
          <div style="color:var(--accent);font-size:16px;flex-shrink:0">♥</div>
        </a>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'tudo' };
  palettes = [
    ['#FF5858','#FA243C'], ['#7C5CFF','#3B2B8C'], ['#20C4B0','#0E6E64'],
    ['#FFB020','#E0631A'], ['#3E8BFF','#1D4FA3'], ['#FF6FB0','#B23A72'],
    ['#57D9A3','#1F8F6B'], ['#9B6BFF','#4B2E99']
  ];
  cover(seed) { return { palette: this.palettes[seed % this.palettes.length], seed }; }

  renderVals() {
    const tabList = [
      { key: 'tudo', label: 'Tudo' }, { key: 'charts', label: 'Paradas' }, { key: 'reviews', label: 'Reviews' },
      { key: 'artistas', label: 'Artistas' }, { key: 'albuns', label: 'Álbuns' }, { key: 'eventos', label: 'Eventos' },
    ];
    const tabs = tabList.map(t => ({ label: t.label, style: {
      padding: '9px 16px', borderRadius: 100, fontSize: 13, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap',
      background: this.state.tab === t.key ? 'var(--accent)' : 'var(--fill-subtle)', color: this.state.tab === t.key ? '#fff' : 'var(--text)'
    }}));

    const raw = [
      { type: 'Parada', title: 'Melhores de Julho', subtitle: '@brunov · 30 músicas', seed: 6, radius: 12 },
      { type: 'Álbum', title: 'Halflight', subtitle: 'Coral Hour · 2026', seed: 6, radius: 10 },
      { type: 'Review', title: 'Sobre Glasswing', subtitle: 'Sofia Reyes · nota 4.5', seed: 1, radius: 10 },
      { type: 'Artista', title: 'Kite Season', subtitle: 'Bedroom Pop', seed: 3, radius: 999 },
      { type: 'Álbum', title: 'Static Bloom', subtitle: 'Kite Season · 2026', seed: 3, radius: 10 },
      { type: 'Evento', title: 'Copa ChartFM — Final', subtitle: '30 de agosto', seed: 9, radius: 10 },
    ].map(i => ({ ...i, cover: this.cover(i.seed) }));

    return { tabs, items: raw };
  }
}

</script>
</body>
</html>
