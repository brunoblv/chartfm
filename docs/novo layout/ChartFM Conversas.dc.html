<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/styles.css">
  <script src="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/_ds_bundle.js"></script>
  <style>
    body{margin:0;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    a:hover{color:var(--accent-hover)}
    ::-webkit-scrollbar{height:0;width:0}
    input::placeholder{color:var(--text-muted)}
  </style>
</helmet>

<div data-theme="dark" style="background:var(--bg);min-height:100vh;font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;color:var(--text)">

  <div style="position:sticky;top:0;z-index:20;background:var(--bg-topbar);borderBottom:1px solid var(--divider);backdrop-filter:blur(12px)">
    <div style="max-width:1200px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;gap:32px">
      <x-import component-from-global-scope="ChartFM.ChartFMLogo" size="{{ 26 }}" hint-size="120px,26px"></x-import>
      <nav style="display:flex;gap:24px;flex:1">
        <a href="#" style="font-size:14px;font-weight:500;color:var(--text-muted)">Home</a>
        <a href="#" style="font-size:14px;font-weight:500;color:var(--text-muted)">Descobrir</a>
        <a href="#" style="font-size:14px;font-weight:500;color:var(--text-muted)">Charts</a>
        <a href="#" style="font-size:14px;font-weight:500;color:var(--text-muted)">Communities</a>
        <a href="#" style="font-size:14px;font-weight:700;color:var(--text)">Conversas</a>
      </nav>
    </div>
  </div>

  <div style="max-width:1200px;margin:0 auto;height:calc(100vh - 55px);display:grid;grid-template-columns:340px 1fr">

    <div style="border-right:1px solid var(--divider);display:flex;flex-direction:column;min-height:0">
      <div style="padding:20px 20px 12px">
        <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:14px">Conversas</div>
        <div style="position:relative">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-muted)">⌕</span>
          <input placeholder="Buscar conversas" style="width:100%;box-sizing:border-box;background:var(--fill-subtle);border:none;border-radius:100px;padding:10px 14px 10px 36px;font-size:13.5px;color:var(--text);outline:none" />
        </div>
      </div>

      <div style="flex:1;overflow-y:auto;padding:4px 8px">
        <sc-for list="{{ conversations }}" as="c" hint-placeholder-count="8">
          <div style="{{ c.rowStyle }}">
            <div style="position:relative;flex-shrink:0">
              <x-import component-from-global-scope="ChartFM.Cover" cover="{{ c.avatar }}" size="{{ 48 }}" rounded="{{ 24 }}" hint-size="48px,48px"></x-import>
              <sc-if value="{{ c.online }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--up-fg,#3ECF8E);border:2px solid var(--bg)"></div>
              </sc-if>
            </div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;justify-content:space-between;gap:8px">
                <div style="font-size:14px;font-weight:{{ c.nameWeight }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.name }}</div>
                <div style="font-size:11.5px;color:var(--text-muted);flex-shrink:0">{{ c.time }}</div>
              </div>
              <div style="font-size:12.5px;color:{{ c.previewColor }};font-weight:{{ c.previewWeight }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">{{ c.preview }}</div>
            </div>
            <sc-if value="{{ c.unread }}" hint-placeholder-val="{{ false }}">
              <div style="width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0"></div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;min-height:0">
      <div style="display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--divider)">
        <x-import component-from-global-scope="ChartFM.Cover" cover="{{ activeChat.avatar }}" size="{{ 40 }}" rounded="{{ 20 }}" hint-size="40px,40px"></x-import>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700">{{ activeChat.name }}</div>
          <div style="font-size:12px;color:var(--text-muted)">{{ activeChat.status }}</div>
        </div>
      </div>

      <div style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px">
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="8">
          <div style="{{ m.wrapStyle }}">
            <div style="{{ m.bubbleStyle }}">
              <sc-if value="{{ m.hasAttachment }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px;background:rgba(0,0,0,0.15);border-radius:10px">
                  <x-import component-from-global-scope="ChartFM.Cover" cover="{{ m.attachment }}" size="{{ 40 }}" hint-size="40px,40px"></x-import>
                  <div style="min-width:0">
                    <div style="font-size:12.5px;font-weight:700">{{ m.attachmentTitle }}</div>
                    <div style="font-size:11px;opacity:.75">{{ m.attachmentSubtitle }}</div>
                  </div>
                </div>
              </sc-if>
              <div style="font-size:14px;line-height:1.5">{{ m.text }}</div>
            </div>
            <div style="{{ m.timeStyle }}">{{ m.time }}</div>
          </div>
        </sc-for>
      </div>

      <div style="padding:16px 24px;border-top:1px solid var(--divider);display:flex;align-items:center;gap:10px">
        <input placeholder="Escreva uma mensagem..." style="flex:1;background:var(--fill-subtle);border:none;border-radius:100px;padding:12px 16px;font-size:14px;color:var(--text);outline:none" />
        <button style="background:var(--accent);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0">↑</button>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  palettes = [
    ['#FF5858','#FA243C'], ['#7C5CFF','#3B2B8C'], ['#20C4B0','#0E6E64'],
    ['#FFB020','#E0631A'], ['#3E8BFF','#1D4FA3'], ['#FF6FB0','#B23A72'],
    ['#57D9A3','#1F8F6B'], ['#9B6BFF','#4B2E99'], ['#FFD166','#D98A1F'],
    ['#4FD1FF','#1E7FB0']
  ];
  cover(seed) { return { palette: this.palettes[seed % this.palettes.length], seed }; }

  renderVals() {
    const raw = [
      { name: 'Sofia Reyes', preview: 'Você viu a nova Review do Halflight?', time: '2min', seed: 5, online: true, unread: true, active: true },
      { name: 'Marco Villani', preview: 'Manda o link daquele vinil', time: '18min', seed: 3, online: true, unread: true },
      { name: 'Dream Pop Diaries', preview: 'Kenji: bora fazer a playlist', time: '1h', seed: 2, online: false, unread: false },
      { name: 'Priya Nandan', preview: 'Você: combinado então 🎶', time: '3h', seed: 7, online: false, unread: false },
      { name: 'Kenji Osei', preview: 'Vc curtiu Static Bloom?', time: '5h', seed: 8, online: true, unread: false },
      { name: 'Théo Lambert', preview: 'Digitando...', time: '1d', seed: 4, online: false, unread: false, typing: true },
      { name: 'Alice Monteiro', preview: 'Te mandei o áudio', time: '2d', seed: 0, online: false, unread: false },
      { name: 'Vinyl Collectors', preview: 'Marco: chegou a prensagem', time: '4d', seed: 9, online: false, unread: false },
    ];
    const conversations = raw.map(c => ({
      ...c, avatar: this.cover(c.seed),
      nameWeight: c.unread ? 700 : 600,
      previewColor: c.typing ? 'var(--accent)' : (c.unread ? 'var(--text)' : 'var(--text-muted)'),
      previewWeight: c.unread ? 600 : 400,
      rowStyle: {
        display: 'flex', alignItems: 'center', gap: 12, padding: '10px 12px', borderRadius: 12, cursor: 'pointer',
        background: c.active ? 'var(--fill-subtle)' : 'transparent'
      }
    }));

    const activeChat = { name: 'Sofia Reyes', status: 'online', avatar: this.cover(5) };

    const rawMessages = [
      { from: 'them', text: 'Você viu a nova Review do Halflight?', time: '14:02' },
      { from: 'them', text: 'A Marisol deu nota 5.0, achei surpreendente', time: '14:02' },
      { from: 'me', text: 'Vi sim! Concordo total, o disco é impecável', time: '14:05' },
      { from: 'them', text: '', time: '14:06', hasAttachment: true, attachmentTitle: 'Halflight', attachmentSubtitle: 'Coral Hour · 2026', attachmentSeed: 6 },
      { from: 'me', text: 'Já ouvi umas 20 vezes essa semana kkkk', time: '14:08' },
      { from: 'them', text: 'kkkkk mesmo, "Low Tide" é a melhor faixa pra mim', time: '14:10' },
      { from: 'me', text: 'Discordo, "Amber Static" é disparado', time: '14:11' },
      { from: 'them', text: 'Vamos discutir isso no Dream Pop Diaries depois', time: '14:12' },
    ];
    const messages = rawMessages.map(m => ({
      ...m,
      attachment: m.attachmentSeed !== undefined ? this.cover(m.attachmentSeed) : undefined,
      wrapStyle: { display: 'flex', flexDirection: 'column', alignItems: m.from === 'me' ? 'flex-end' : 'flex-start' },
      bubbleStyle: {
        maxWidth: '68%', padding: '10px 14px', borderRadius: m.from === 'me' ? '16px 16px 4px 16px' : '16px 16px 16px 4px',
        background: m.from === 'me' ? 'var(--accent)' : 'var(--fill-subtle)', color: m.from === 'me' ? '#fff' : 'var(--text)'
      },
      timeStyle: { fontSize: 11, color: 'var(--text-muted)', marginTop: 4 }
    }));

    return { conversations, activeChat, messages };
  }
}

</script>
</body>
</html>
