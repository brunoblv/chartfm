<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/styles.css">
  <script src="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/_ds_bundle.js"></script>
  <style>
    body{margin:0;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    a:hover{color:var(--accent-hover)}
    ::-webkit-scrollbar{height:0;width:0}
    input::placeholder{color:var(--text-muted)}
  </style>
</helmet>

<div data-theme="dark" style="background:var(--bg);min-height:100vh;font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;color:var(--text);display:grid;grid-template-columns:1fr 1fr">

  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px">
    <div style="width:100%;max-width:360px">
      <x-import component-from-global-scope="ChartFM.ChartFMLogo" size="{{ 30 }}" hint-size="140px,30px"></x-import>
      <div style="font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-top:28px">Bem-vindo de volta</div>
      <div style="font-size:14.5px;color:var(--text-muted);margin-top:8px;margin-bottom:28px">Entre para ver suas paradas e a sua rede musical.</div>

      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
        <button style="display:flex;align-items:center;justify-content:center;gap:10px;background:var(--fill-subtle);color:var(--text);border:none;padding:13px 0;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer">◎ Continuar com Google</button>
        <button style="display:flex;align-items:center;justify-content:center;gap:10px;background:#1DB954;color:#fff;border:none;padding:13px 0;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer">♫ Continuar com Spotify</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <div style="flex:1;height:1px;background:var(--divider)"></div>
        <div style="font-size:12px;color:var(--text-muted)">ou</div>
        <div style="flex:1;height:1px;background:var(--divider)"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px">E-mail</div>
          <input placeholder="voce@email.com" style="width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--divider-strong);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--text);outline:none" />
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <div style="font-size:12.5px;font-weight:700;color:var(--text-muted)">Senha</div>
            <a href="#" style="font-size:12.5px;font-weight:600">Esqueceu?</a>
          </div>
          <input type="password" value="••••••••" style="width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--divider-strong);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--text);outline:none" />
        </div>
      </div>

      <button style="width:100%;background:var(--accent);color:#fff;border:none;padding:14px 0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px">Entrar</button>

      <div style="text-align:center;font-size:13.5px;color:var(--text-muted);margin-top:20px">Não tem conta? <a href="#" style="font-weight:700">Criar conta</a></div>
    </div>
  </div>

  <div style="background:linear-gradient(160deg, #3B2B8C, #FA243C 130%);padding:56px;display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative;overflow:hidden">
    <div style="position:relative;z-index:1">
      <div style="font-size:38px;font-weight:800;letter-spacing:-0.03em;line-height:1.15;max-width:420px">Sua semana em música, ranqueada e compartilhada.</div>
      <div style="font-size:15px;color:rgba(255,255,255,0.75);margin-top:16px;max-width:380px;line-height:1.5">Monte sua parada, siga a rede e descubra o que sua comunidade está ouvindo.</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:40px;position:relative;z-index:1">
      <sc-for list="{{ mosaic }}" as="m" hint-placeholder-count="8">
        <div style="width:100%;aspect-ratio:1;min-width:0">
          <x-import component-from-global-scope="ChartFM.Cover" cover="{{ m }}" rounded="{{ 12 }}" hint-size="100%,100%" style="width:100%;height:100%"></x-import>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  palettes = [
    ['#FF5858','#FA243C'], ['#7C5CFF','#3B2B8C'], ['#20C4B0','#0E6E64'],
    ['#FFB020','#E0631A'], ['#3E8BFF','#1D4FA3'], ['#FF6FB0','#B23A72'],
    ['#57D9A3','#1F8F6B'], ['#9B6BFF','#4B2E99'], ['#FFD166','#D98A1F'],
    ['#4FD1FF','#1E7FB0']
  ];
  cover(seed) { return { palette: this.palettes[seed % this.palettes.length], seed }; }
  renderVals() {
    return { mosaic: [6, 1, 3, 9, 5, 2, 8, 4].map(s => this.cover(s)) };
  }
}

</script>
</body>
</html>
