<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/styles.css">
  <script src="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/_ds_bundle.js"></script>
  <style>
    body{margin:0;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    a:hover{color:var(--accent-hover)}
    ::-webkit-scrollbar{height:0;width:0}
  </style>
</helmet>

<div data-theme="dark" style="background:var(--bg);min-height:100vh;font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;color:var(--text)">

  <div style="position:sticky;top:0;z-index:20;background:var(--bg-topbar);border-bottom:1px solid var(--divider);backdrop-filter:blur(12px)">
    <div style="max-width:820px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;gap:32px">
      <x-import component-from-global-scope="ChartFM.ChartFMLogo" size="{{ 26 }}" hint-size="120px,26px"></x-import>
      <div style="flex:1"></div>
      <a href="#" style="font-size:14px;font-weight:600;color:var(--text-muted)">← Início</a>
    </div>
  </div>

  <div style="max-width:820px;margin:0 auto;padding:56px 40px 96px">
    <div style="font-size:34px;font-weight:800;letter-spacing:-0.03em">O que há de novo</div>
    <div style="font-size:15px;color:var(--text-muted);margin-top:8px">O changelog oficial do ChartFM.</div>

    <div style="display:flex;gap:8px;margin-top:24px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <button onclick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;margin-top:32px">
      <sc-for list="{{ releases }}" as="r" hint-placeholder-count="5">
        <div style="display:flex;gap:20px">
          <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
            <div style="width:10px;height:10px;border-radius:50%;background:var(--accent)"></div>
            <div style="{{ r.lineStyle }}"></div>
          </div>
          <div style="padding-bottom:32px;flex:1">
            <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
              <div style="font-size:16px;font-weight:800">{{ r.version }}</div>
              <div style="font-size:12.5px;color:var(--text-muted)">{{ r.date }}</div>
            </div>
            <sc-for list="{{ r.items }}" as="it" hint-placeholder-count="3">
              <div style="display:flex;gap:8px;align-items:flex-start;margin-top:8px">
                <div style="{{ it.tagStyle }}">{{ it.tag }}</div>
                <div style="font-size:13.5px;line-height:1.5">{{ it.text }}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'todos' };
  tagColors = { Novidade: '#20C4B0', Melhoria: '#3E8BFF', Correção: '#FFB020', 'Em desenvolvimento': '#7C5CFF' };

  filterStyle(active) {
    return { border: 'none', cursor: 'pointer', padding: '7px 14px', borderRadius: 100, fontSize: 12.5, fontWeight: 700,
      background: active ? 'var(--accent)' : 'var(--fill-subtle)', color: active ? '#fff' : 'var(--text-muted)' };
  }

  renderVals() {
    const raw = [
      { version: 'v2.4', date: '10 jul 2026', items: [
        { tag: 'Novidade', text: 'Comparador de Usuários — compare afinidade musical com qualquer perfil.' },
        { tag: 'Novidade', text: 'Página de Descobertas com recomendações personalizadas.' },
        { tag: 'Melhoria', text: 'Hub do Artista agora mostra estatísticas de álbuns e faixas.' },
      ]},
      { version: 'v2.3', date: '22 jun 2026', items: [
        { tag: 'Novidade', text: 'Copa ChartFM — torneio comunitário com grupos e chaveamento.' },
        { tag: 'Correção', text: 'Corrigido cálculo de pontos em paradas editadas após publicação.' },
      ]},
      { version: 'v2.2', date: '30 mai 2026', items: [
        { tag: 'Novidade', text: 'Biblioteca pessoal reunindo favoritos, charts e reviews salvos.' },
        { tag: 'Melhoria', text: 'Editorial ganhou destaque no menu principal.' },
      ]},
      { version: 'v2.1', date: '14 mai 2026', items: [
        { tag: 'Em desenvolvimento', text: 'App mobile nativo — beta fechado começando em breve.' },
        { tag: 'Melhoria', text: 'Importação via Last.fm agora sincroniza automaticamente toda semana.' },
      ]},
    ].map((r, i, arr) => ({
      ...r, lineStyle: i < arr.length - 1 ? { width: 2, flex: 1, background: 'var(--divider)', minHeight: 30 } : {},
      items: r.items.map(it => ({ ...it, tagStyle: { fontSize: 10.5, fontWeight: 700, padding: '3px 8px', borderRadius: 100, background: this.tagColors[it.tag] + '22', color: this.tagColors[it.tag], whiteSpace: 'nowrap', flexShrink: 0 } })),
    }));

    const filterDefs = ['Todos', 'Novidade', 'Melhoria', 'Correção'];
    const filters = filterDefs.map(label => ({
      label, style: this.filterStyle(this.state.filter === label.toLowerCase() || (label === 'Todos' && this.state.filter === 'todos')),
      onClick: () => this.setState({ filter: label.toLowerCase() }),
    }));

    const releases = this.state.filter === 'todos' ? raw : raw.map(r => ({ ...r, items: r.items.filter(it => it.tag.toLowerCase() === this.state.filter) })).filter(r => r.items.length);

    return { filters, releases };
  }
}

</script>
</body>
</html>
