<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/styles.css">
  <script src="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/_ds_bundle.js"></script>
  <style>
    body{margin:0;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    a:hover{color:var(--accent-hover)}
    ::-webkit-scrollbar{height:0;width:0}
  </style>
</helmet>

<div data-theme="dark" style="background:var(--bg);min-height:100vh;font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;color:var(--text)">

  <div style="position:sticky;top:0;z-index:20;background:var(--bg-topbar);border-bottom:1px solid var(--divider);backdrop-filter:blur(12px)">
    <div style="max-width:820px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;gap:32px">
      <x-import component-from-global-scope="ChartFM.ChartFMLogo" size="{{ 26 }}" hint-size="120px,26px"></x-import>
      <div style="flex:1"></div>
      <a href="ChartFM Push.dc.html" style="font-size:14px;font-weight:600;color:var(--text-muted)">← Rodada atual</a>
    </div>
  </div>

  <div style="border-bottom:1px solid var(--divider);background:var(--surface)">
    <div style="max-width:820px;margin:0 auto;padding:14px 40px 0;display:flex;align-items:center;gap:10px">
      <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#FF7070);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:800;font-size:14px">⚡</div>
      <div>
        <div style="font-size:15px;font-weight:800;letter-spacing:-0.02em;line-height:1">Push</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">O jogo semanal de indicar músicas</div>
      </div>
    </div>
    <div style="max-width:820px;margin:0 auto;padding:0 40px;display:flex;gap:2px;margin-top:10px;overflow-x:auto">
      <a href="ChartFM Push Sobre.dc.html" style="padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text-muted);border-bottom:2px solid transparent">Sobre</a>
      <a href="ChartFM Push.dc.html" style="padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text-muted);border-bottom:2px solid transparent">Início</a>
      <a href="ChartFM Push Ranking.dc.html" style="padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text-muted);border-bottom:2px solid transparent">Ranking</a>
      <a href="#" style="padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text);border-bottom:2px solid var(--accent)">Histórico</a>
    </div>
  </div>

  <div style="max-width:820px;margin:0 auto;padding:28px 40px 96px">
    <div style="font-size:15px;color:var(--text-muted);margin-bottom:24px">Rodadas encerradas e seus vencedores.</div>
    <div style="display:flex;flex-direction:column;gap:28px">
      <sc-for list="{{ rounds }}" as="rd" hint-placeholder-count="4">
        <div style="border-radius:16px;background:var(--surface);border:1px solid var(--divider);overflow:hidden">
          <div style="padding:18px 22px;border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div style="flex:1">
              <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Rodada {{ rd.number }} · T{{ rd.season }}</div>
              <div style="font-size:18px;font-weight:700;letter-spacing:-0.02em">{{ rd.title }}</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:100px;background:#1ed760;color:#fff;font-size:12px;font-weight:700">↗ Playlist</div>
          </div>
          <div style="padding:12px 0">
            <sc-for list="{{ rd.results }}" as="r" hint-placeholder-count="3">
              <div style="{{ r.rowStyle }}">
                <div style="width:28px;text-align:center;flex-shrink:0;font-size:15px;font-weight:700;color:{{ r.rankColor }}">{{ r.rankDisplay }}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.title }}</div>
                  <div style="font-size:11px;color:var(--text-muted)">{{ r.artist }} · @{{ r.handle }}</div>
                </div>
                <div style="font-size:13px;font-weight:700;flex-shrink:0">{{ r.points }} pts</div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const roundsData = [
      { number: 47, season: 3, title: 'Rodada 47 · Temporada 3', results: [
        { title: 'Amber Static', artist: 'Coral Hour', handle: 'alicemtr', points: 128 },
        { title: 'Wren Autumn', artist: 'Salt Lung', handle: 'theolamb', points: 96 },
        { title: 'Faraway Static', artist: 'Marble Season', handle: 'sofireyes', points: 74 },
      ]},
      { number: 46, season: 3, title: 'Rodada 46 · Temporada 3', results: [
        { title: 'Cold Harbor', artist: 'Halflight Parade', handle: 'kenjiosei', points: 142 },
        { title: 'Low Static', artist: 'Bexley Drift', handle: 'priyanandan', points: 88 },
        { title: 'Night Glass', artist: 'Kite String Collective', handle: 'marcovillani', points: 61 },
      ]},
      { number: 45, season: 3, title: 'Rodada 45 · Temporada 3', results: [
        { title: 'Marble Fields', artist: 'Marble Season', handle: 'alicemtr', points: 119 },
        { title: 'Harbor Lights', artist: 'Cold Harbor', handle: 'rafaprado', points: 97 },
        { title: 'Salt & Static', artist: 'Salt Lung', handle: 'anaferraz', points: 70 },
      ]},
    ];
    const rounds = roundsData.map(rd => ({
      ...rd,
      results: rd.results.map((r, i) => ({
        ...r, rankDisplay: i < 3 ? ['🥇','🥈','🥉'][i] : String(i + 1), rankColor: i === 0 ? 'var(--accent)' : 'var(--text-muted)',
        rowStyle: { display: 'flex', alignItems: 'center', gap: 12, padding: '8px 22px', background: i === 0 ? 'rgba(245,158,11,0.06)' : 'transparent' },
      })),
    }));
    return { rounds };
  }
}

</script>
</body>
</html>
