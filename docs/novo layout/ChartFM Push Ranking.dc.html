<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/styles.css">
  <script src="_ds/chartfm-f0588750-09ca-4e88-9539-34a7f9b36dba/_ds_bundle.js"></script>
  <style>
    body{margin:0;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    a:hover{color:var(--accent-hover)}
    ::-webkit-scrollbar{height:0;width:0}
  </style>
</helmet>

<div data-theme="dark" style="background:var(--bg);min-height:100vh;font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;color:var(--text)">

  <div style="position:sticky;top:0;z-index:20;background:var(--bg-topbar);border-bottom:1px solid var(--divider);backdrop-filter:blur(12px)">
    <div style="max-width:820px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;gap:32px">
      <x-import component-from-global-scope="ChartFM.ChartFMLogo" size="{{ 26 }}" hint-size="120px,26px"></x-import>
      <div style="flex:1"></div>
      <a href="ChartFM Push.dc.html" style="font-size:14px;font-weight:600;color:var(--text-muted)">← Rodada atual</a>
    </div>
  </div>

  <div style="border-bottom:1px solid var(--divider);background:var(--surface)">
    <div style="max-width:820px;margin:0 auto;padding:14px 40px 0;display:flex;align-items:center;gap:10px">
      <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#FF7070);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:800;font-size:14px">⚡</div>
      <div>
        <div style="font-size:15px;font-weight:800;letter-spacing:-0.02em;line-height:1">Push</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">O jogo semanal de indicar músicas</div>
      </div>
    </div>
    <div style="max-width:820px;margin:0 auto;padding:0 40px;display:flex;gap:2px;margin-top:10px;overflow-x:auto">
      <a href="ChartFM Push Sobre.dc.html" style="padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text-muted);border-bottom:2px solid transparent">Sobre</a>
      <a href="ChartFM Push.dc.html" style="padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text-muted);border-bottom:2px solid transparent">Início</a>
      <a href="#" style="padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text);border-bottom:2px solid var(--accent)">Ranking</a>
      <a href="ChartFM Push Historico.dc.html" style="padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text-muted);border-bottom:2px solid transparent">Histórico</a>
    </div>
  </div>

  <div style="max-width:820px;margin:0 auto;padding:28px 40px 96px">
    <div style="display:flex;gap:4px;background:var(--fill-subtle);border-radius:12px;padding:4px;margin-bottom:20px;overflow-x:auto">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button onclick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px">{{ contextLabel }}</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <sc-for list="{{ entries }}" as="e" hint-placeholder-count="8">
        <div style="{{ e.rowStyle }}">
          <div style="width:28px;text-align:center;flex-shrink:0;font-size:22px">{{ e.emoji }}</div>
          <div style="{{ e.badgeStyle }}">{{ e.badgeNum }}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ e.name }}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">@{{ e.handle }}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="{{ e.pointsStyle }}">{{ e.points }}</div>
            <div style="font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:.05em;margin-top:2px">PTS</div>
            <sc-if value="{{ e.hasWins }}" hint-placeholder-val="{{ false }}">
              <div style="font-size:10px;color:var(--text-muted);margin-top:2px">{{ e.wins }} vitórias</div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'geral' };
  PODIUM = ['#FFD700', '#C0C0C0', '#CD7F32'];
  tabStyle(active) {
    return { padding: '8px 14px', borderRadius: 9, border: 'none', fontSize: 13, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap',
      background: active ? 'var(--surface)' : 'transparent', color: active ? 'var(--text)' : 'var(--text-muted)' };
  }

  renderVals() {
    const tabDefs = [{ key: 'geral', label: 'Geral' }, { key: 3, label: 'T3' }, { key: 2, label: 'T2' }, { key: 1, label: 'T1' }];
    const tabs = tabDefs.map(t => ({ label: t.label, style: this.tabStyle(this.state.tab === t.key), onClick: () => this.setState({ tab: t.key }) }));

    const raw = [
      { name: 'Alice Monteiro', handle: 'alicemtr', points: 2140, wins: 6 },
      { name: 'Théo Lambert', handle: 'theolamb', points: 1980, wins: 4 },
      { name: 'Sofia Reyes', handle: 'sofireyes', points: 1704, wins: 3 },
      { name: 'Kenji Osei', handle: 'kenjiosei', points: 1522, wins: 2 },
      { name: 'Priya Nandan', handle: 'priyanandan', points: 1310, wins: 1 },
      { name: 'Marco Villani', handle: 'marcovillani', points: 1188, wins: 1 },
      { name: 'Rafa Prado', handle: 'rafaprado', points: 940, wins: 0 },
      { name: 'Ana Ferraz', handle: 'anaferraz', points: 812, wins: 0 },
    ];
    const podiumEmoji = ['🥇', '🥈', '🥉'];
    const entries = raw.map((e, i) => {
      const rank = i + 1; const isPodium = rank <= 3;
      return {
        ...e, badgeNum: rank, emoji: isPodium ? podiumEmoji[rank - 1] : '',
        rowStyle: { display: 'flex', alignItems: 'center', gap: 12, padding: isPodium ? '12px 16px' : '9px 16px', borderRadius: 14,
          background: isPodium ? `color-mix(in srgb, ${this.PODIUM[rank-1]} 8%, var(--surface))` : 'var(--surface)',
          border: `1px solid ${isPodium ? `color-mix(in srgb, ${this.PODIUM[rank-1]} 22%, var(--divider))` : 'var(--divider)'}` },
        badgeStyle: isPodium ? { display: 'none' } : { width: 22, height: 22, borderRadius: 5, background: 'var(--fill-subtle)', color: 'var(--text-muted)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 800, flexShrink: 0 },
        pointsStyle: { fontSize: 20, fontWeight: 800, letterSpacing: '-0.03em', color: isPodium ? this.PODIUM[rank-1] : 'var(--text)', lineHeight: 1 },
        hasWins: e.wins > 0,
      };
    });

    const contextLabel = this.state.tab === 'geral' ? 'Ranking geral' : `Temporada ${this.state.tab}`;

    return { tabs, entries, contextLabel };
  }
}

</script>
</body>
</html>
